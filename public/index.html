<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191927" />
    <title>EVA.CM</title>
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <script>
        // 只需修改这一行：shelter、cat 或 star。
        const ACTIVE_HOME_PAGE = "shelter";

        const homePages = Object.freeze({
            shelter: "./pages/shelter.html",
            cat: "./pages/cat.html",
            star: "./pages/star.html",
        });
        const homePage = homePages[ACTIVE_HOME_PAGE];

        if (!homePage) {
            throw new Error(`Unknown home page: ${ACTIVE_HOME_PAGE}`);
        }

        window.location.replace(homePage);
    </script>
</head>

<body>
    <p>正在加载首页……</p>
    <noscript>请启用 JavaScript 以加载首页。</noscript>
</body>

</html>
